name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ios-ccache-${{ github.ref }}
          restore-keys: |
            ios-ccache-

      - name: Configure
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.paperboat.toolchain.cmake \
            -DPLATFORM=OS64 -DIOS_SIGNING=OFF

      - name: Build
        run: cmake --build build-ios --config Release --parallel $(sysctl -n hw.logicalcpu)

      - name: Package IPA
        run: |
          APP=$(find build-ios -name '*.app' -path '*Release-iphoneos*' -maxdepth 4 | head -1)
          echo "App bundle: $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Paperboat-unsigned.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Paperboat-unsigned-ipa
          path: out/Paperboat-unsigned.ipa
