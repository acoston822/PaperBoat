name: Build iOS IPA

on:
  push:
    branches:
      - "ipa-build-20261007"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Configure
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.paperboat.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DIOS_SIGNING=OFF

      - name: Build
        run: |
          cmake --build build-ios --config Release

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP_PATH="build-ios/Release-iphoneos/Paperboat.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Paperboat-unsigned.ipa Payload
          unzip -l Paperboat-unsigned.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Paperboat-unsigned-IPA
          path: Paperboat-unsigned.ipa
          if-no-files-found: error
